<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cardenza · CardputerZero</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 0%,#2b2f34,#15171a 70%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  #status{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:12px;color:#9aa;z-index:20}
  #status:empty{display:none}

  /* 官方 CP0 机身贴图（630×405）：这就是麻将那台的同一张图 */
  .device{
    position:relative;
    width:min(96vw, calc(96vh * 630 / 405));
    aspect-ratio: 630 / 405;
    background:url(cp0-light.png) center / 100% 100% no-repeat;
    filter: drop-shadow(0 16px 34px rgba(0,0,0,.55));
    -webkit-user-select:none; user-select:none;
  }
  /* 屏幕洞：(155,21) 处 320×170（与 DesktopSimulatorFrame 完全一致） */
  #screen{
    position:absolute;
    left:calc(155 / 630 * 100%);
    top:calc(21 / 405 * 100%);
    width:calc(320 / 630 * 100%);
    height:calc(170 / 405 * 100%);
    image-rendering:pixelated; background:#000; border-radius:2px; cursor:pointer; z-index:2;
  }
  /* 键位热点（11×4，叠在机身 PNG 的键帽上） */
  #hotspots{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .hot{ position:absolute; pointer-events:auto; border-radius:8px; touch-action:none; cursor:pointer;
    transition:background .06s, box-shadow .06s; }
  .hot.down{ background:rgba(90,170,255,.30); box-shadow:inset 0 0 0 2px rgba(120,190,255,.75); }

  #hint{ position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:#828a92;
    max-width:820px; margin:0 auto; padding:0 12px; line-height:1.5; z-index:20 }
  kbd{ background:#24282c;border:1px solid #3a3f44;border-radius:3px;padding:0 4px;color:#c8ccd0;font-size:10px }
</style>
</head>
<body>
  <div id="status">加载中…</div>

  <div class="device" id="device">
    <canvas id="screen" width="320" height="170" tabindex="0"></canvas>
    <div id="hotspots"></div>
  </div>

  <div id="hint">Cardenza 合成器 · CP0 官方机身 · 内部 240×135 放大到 320×170。<b>点画面或按任意键开启声音。</b><br>
    点机身键帽，或用电脑键盘（按物理位置）。<kbd>Space</kbd>=PLAY，<kbd>Enter</kbd>=OK，<kbd>Caps</kbd>=FN，<kbd>Ctrl</kbd>=CTRL。</div>

  <script src="cp0-web.js"></script>
  <script src="cardenza.js" async onload="CardenzaCP0.start()" onerror="CardenzaCP0.fail('cardenza.js 未加载')"></script>
</body>
</html>
